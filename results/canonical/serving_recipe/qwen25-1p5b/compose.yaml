services:
  neoserve:
    build:
      context: .
      dockerfile: Dockerfile.arm64
    platform: linux/arm64
    ports: ["8000:8000"]
    environment:
      VLLM_TARGET_DEVICE: "cpu"
      LD_PRELOAD: "/usr/local/lib/libmimalloc.so"
      VLLM_CPU_OMP_THREADS_BIND: "0-15"
      VLLM_CPU_KVCACHE_SPACE: "16"
      NEOSERVE_LSE_ATOMICS: "off"
    # Recommended instance: c8g.4xlarge (16 vCPU / 32 GB)
