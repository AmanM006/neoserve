name: Native Arm64 Evidence & Benchmark Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  arm64-evidence:
    name: Native Arm64 Neoverse-N2 Evidence Runner
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect Hardware & CPU Architecture
        run: |
          echo "=== CPU ARCHITECTURE ==="
          uname -m
          lscpu || cat /proc/cpuinfo | head -n 20
          echo "========================"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml rich typer jinja2 httpx matplotlib

      - name: Verify Cryptographic SHA-256 Ledger
        run: |
          python scripts/verify_ledger.py results/canonical

      - name: Run Judge Verification Suite
        run: |
          python scripts/demo.py --all

      - name: Verify KleidiAI Micro-Kernel ISA Specs
        run: |
          python scripts/verify_kernel_isa.py

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v
