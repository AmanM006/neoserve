name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Ledger Verification (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: .
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml rich typer jinja2 httpx matplotlib

      - name: Run Cryptographic SHA-256 Ledger Verification
        run: |
          python scripts/verify_ledger.py results/canonical

      - name: Run Judge Verification CLI (Non-interactive)
        run: |
          python scripts/demo.py --all

      - name: Verify KleidiAI Micro-Kernel ISA Disassembly
        run: |
          python scripts/verify_kernel_isa.py --json

      - name: Run Full Automated Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Verify MCP Server CLI Output
        run: |
          python src/mcp/server.py
